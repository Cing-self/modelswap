name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/web/frontend/package-lock.json

      # The lock is generated with npm 11; node 20 ships npm 10 whose stricter
      # ci check rejects it. Install npm 11 for dependency install only.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      # Root-level tests import pure helpers and a few rendered React
      # components from the frontend source tree, so install the matching
      # frontend dependency graph before Vitest runs.
      - run: npm ci --ignore-scripts
        working-directory: src/web/frontend

      # CI approves a main commit for automatic patch release. Validate that
      # release's reviewed notes here, before a successful CI can trigger the
      # publish workflow. The release job repeats this gate before any
      # external side effect, but its post-bump tests must validate the bumped
      # version itself rather than recursively requiring another future note.
      #
      # The gate is conditional: chore/docs-only merges (gitignore, tests,
      # repo docs, internal notes) neither require notes nor publish — see
      # release-changes.js for the skip list. README.md always counts (npm
      # packs it). Needs full history to diff against the last release
      # commit, hence the unshallow fetch; one matrix leg is enough for a
      # repo-level gate.
      - name: Validate release notes (release-worthy changes only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          git fetch --quiet --unshallow origin 2>/dev/null || true
          node .github/scripts/validate-release-gate.js

      # Full compile (not --noEmit): tests import web/api modules that require
      # compiled outputs under dist/. copy-web is also required: compiled
      # dist/providers modules (store, codex adapter) require dist/web/api
      # files (models-dev, log-writer) that tsc alone does not emit.
      - run: npx tsc
      - run: npm run copy-web

      - run: npx vitest run

      - name: Build frontend
        working-directory: src/web/frontend
        run: npm run build

      - name: Full root build
        run: npm run build

name: Publish to NPM and GitHub Release

# Release runs ONLY after CI proves the pushed commit on all three OS
# matrices (the in-workflow test steps below run on macos only — they can
# never see ubuntu/windows failures, which is how v1.0.20–22 shipped while
# CI was red). The workflow_run event fires when a CI run on main completes;
# PR-triggered CI completions are excluded by the event == 'push' guard in
# the job if-condition, so a fork branch named "main" can never gate a
# release. Manual dispatch is the escape hatch for choosing a
# patch/minor/major bump.
#
# The version-bump commit is pushed with GITHUB_TOKEN and carries [skip ci],
# so CI never runs for it, this workflow never re-fires, and no loop forms.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        default: patch
        options: [patch, minor, major]

# Serialize releases: a second push queues behind the in-flight release
# instead of racing the version bump. Never cancel mid-publish.
concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Chore/docs-only merges to main must not publish a version: detect
  # whether anything release-worthy changed since the last release commit
  # and let the release job skip itself otherwise (dispatch still publishes).
  changes:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: detect
        run: node .github/scripts/release-changes.js >> "$GITHUB_OUTPUT"

  release:
    needs: changes
    # workflow_dispatch bypasses the gate (explicit human intent); a
    # workflow_run must be a push-triggered, successful CI completion of a
    # release-worthy diff. Failed CI runs land here as "skipped", not
    # published.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       needs.changes.outputs.release == 'true')
    runs-on: macos-latest
    permissions:
      contents: write   # push the bump commit + tag, create the GitHub Release
      id-token: write   # npm OIDC trusted publishing (no NPM_TOKEN secret)
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run events carry the triggering push's SHA; dispatch
          # falls back to the branch tip.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      # Node 24 ships npm 11.5+ — trusted publishing requires npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Compute next version
        id: bump
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          NEXT="$(node -e "
            const c = process.argv[1].split('.').map(Number);
            const bump = process.argv[2];
            if (bump === 'major') { c[0]++; c[1] = 0; c[2] = 0; }
            else if (bump === 'minor') { c[1]++; c[2] = 0; }
            else { c[2]++; }
            console.log(c.join('.'));
          " "$CURRENT" "$BUMP")"
          if git rev-parse "refs/tags/v$NEXT" >/dev/null 2>&1; then
            echo "::error::Tag v$NEXT already exists. Re-run after the in-flight release completes."
            exit 1
          fi
          echo "Current: $CURRENT → Next: v$NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      # Gate BEFORE any external side effect: the next version's reviewed
      # release notes must exist and validate before the bump commit is
      # created, pushed, tagged, published to npm, or released on GitHub.
      # A failure here leaves the repository and registries untouched —
      # no half-released version can be left behind.
      - name: Validate reviewed release notes
        run: node .github/scripts/release-notes.js validate "v${{ steps.bump.outputs.version }}"

      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ steps.bump.outputs.version }}" --no-git-tag-version
          git commit -am "chore(release): v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          # Explicit refspecs: --follow-tags only pushes ANNOTATED tags, and
          # `git tag` above creates a lightweight one (bit us on v1.0.17 —
          # npm published but the tag never reached the remote, so
          # .github/scripts/publish-release.sh could not create the GitHub Release).
          # HEAD:main — the workflow_run checkout is a detached HEAD at the
          # CI-approved SHA; "push origin main" has no local branch to match.
          git push origin HEAD:main
          git push origin "refs/tags/v${{ steps.bump.outputs.version }}"

      # ---- Everything below only runs on the bumped, tagged tree: a broken
      # build fails BEFORE npm/Release ever see it. ----

      - name: Install frontend deps (locked)
        run: cd src/web/frontend && npm ci

      - name: Build browser extension (shipped in the npm package)
        run: cd extension && npm ci && npm run build

      - run: npm ci

      # Compile before testing: tests import web/api modules that require
      # compiled outputs under dist/ (same reason ci.yml compiles first).
      - run: npx tsc

      - name: Tests
        run: npm test

      - name: Build (tsc + presets + web + frontend)
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run

      # Desktop installer BEFORE npm publish: every artifact must build before
      # anything goes public, so a broken desktop build can't leave a
      # half-published release. arm64 + x64 dmg (universal dropped — it was
      # ~2x the size of either single-arch build). --publish never: GH_TOKEN's
      # mere presence makes electron-builder open its OWN draft release —
      # .github/scripts/publish-release.sh owns release creation.
      - name: Build desktop installers (arm64 + x64 dmg)
        run: npx electron-builder --mac dmg --arm64 --x64 --publish never
        env:
          GH_TOKEN: ${{ github.token }}

      # Trusted publishing (OIDC): npm exchanges GitHub's short-lived OIDC
      # token for publish rights — no NPM_TOKEN secret involved. Requires the
      # trusted-publisher config on the npm side (Cing-self/modelswap, publish.yml).
      - name: Publish to NPM
        run: npm publish --access public

      # .github/scripts/publish-release.sh sees the tag we just pushed (exists → skipped) and
      # owns release creation + dmg/sha256 upload.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh "v${{ steps.bump.outputs.version }}"

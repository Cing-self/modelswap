<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>MODELSWAP</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --ink: #211d1a;
      --muted: #8d857c;
      --line: #e8e4dd;
      --line-strong: #d9d3c9;
      --accent: #b4552d;
      --accent-soft: #f4e6de;
      --ok: #4a7c59;
      --ok-soft: #e4ede6;
      --danger: #a8402f;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191715;
        --surface: #211e1b;
        --ink: #ece7e0;
        --muted: #9a938b;
        --line: #322e29;
        --line-strong: #403a34;
        --accent: #d0703f;
        --accent-soft: #3a2a20;
        --ok: #7fae8c;
        --ok-soft: #263128;
        --danger: #d3705c;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      width: 384px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

    /* ── Header ─────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px 12px;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .brand { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .conn { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
    .conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
    .conn.on .dot { background: var(--ok); }
    .conn.off .dot { background: var(--danger); }

    .banner {
      margin: 10px 16px 0; padding: 8px 11px;
      font-size: 11.5px; color: var(--accent);
      background: var(--accent-soft); border-radius: 8px;
    }

    main { padding: 4px 16px 16px; }
    section + section { margin-top: 18px; }

    .section-label {
      display: flex; align-items: baseline; justify-content: space-between;
      font-size: 11px; font-weight: 600; letter-spacing: 1.5px; color: var(--muted);
      padding: 12px 0 6px;
    }
    .section-label .count { font-weight: 500; letter-spacing: 0; }

    /* ── Request items ──────────────────────────────────── */
    .item { padding: 12px 0; }
    .item + .item { border-top: 1px solid var(--line); }
    .item-head { display: flex; align-items: center; gap: 8px; }
    .item-head .key {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12.5px; font-weight: 600; letter-spacing: -0.2px;
      overflow-wrap: anywhere;
    }
    .status {
      margin-left: auto; display: flex; align-items: center; gap: 5px;
      font-size: 11px; white-space: nowrap;
    }
    .status .dot { width: 6px; height: 6px; border-radius: 50%; }
    .status.pending { color: var(--accent); }
    .status.pending .dot { background: var(--accent); }
    .status.done { color: var(--ok); }
    .status.done .dot { background: var(--ok); }
    .meta { margin-top: 3px; font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
    .fields { margin-top: 7px; display: grid; gap: 3px; }
    .fields .f {
      display: flex; align-items: center; gap: 8px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11.5px; color: var(--muted);
    }
    .fields .f .val { color: var(--ok); }
    .steps { margin: 8px 0 0; padding: 0; list-style: none; counter-reset: step; }
    .steps li {
      counter-increment: step; position: relative;
      padding: 1px 0 1px 20px; font-size: 11.5px; color: var(--muted);
    }
    .steps li::before {
      content: counter(step);
      position: absolute; left: 2px; top: 2.5px;
      width: 13px; height: 13px; border-radius: 4px;
      font-size: 9.5px; line-height: 13px; text-align: center;
      background: var(--line); color: var(--ink);
    }
    .masked-line {
      margin-top: 7px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11.5px; color: var(--ok);
    }
    .actions { display: flex; gap: 8px; margin-top: 10px; }

    /* ── Controls ───────────────────────────────────────── */
    button {
      font: inherit; font-size: 12px; font-weight: 500;
      color: var(--ink); background: transparent;
      border: 1px solid var(--line-strong); border-radius: 8px;
      padding: 5px 12px; cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, transform .06s ease;
    }
    button:hover { background: var(--surface); border-color: var(--muted); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.55; cursor: default; transform: none; }
    button.primary {
      color: #fff; background: var(--accent); border-color: var(--accent);
    }
    button.primary:hover { filter: brightness(1.06); background: var(--accent); }
    button.primary:disabled { filter: none; background: var(--accent); }
    button.icon {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px;
    }
    button.icon svg { width: 12px; height: 12px; }

    .capture-row { display: flex; margin-top: 10px; }
    .capture-row input {
      flex: 1; min-width: 0;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11.5px; color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong); border-right: none;
      border-radius: 8px 0 0 8px; padding: 6px 10px;
      outline: none;
    }
    .capture-row input:focus { border-color: var(--accent); }
    .capture-row button {
      border-radius: 0 8px 8px 0; border-left: none;
    }

    /* ── Manual save form ───────────────────────────────── */
    .field { margin-top: 8px; }
    .field label {
      display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px;
    }
    .field input, .field textarea {
      width: 100%;
      font: inherit; font-size: 12.5px; color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line-strong); border-radius: 8px;
      padding: 7px 10px; outline: none;
      transition: border-color .15s ease;
    }
    .field textarea {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11.5px; min-height: 60px; resize: vertical;
    }
    .field input:focus, .field textarea:focus { border-color: var(--accent); }
    .field input::placeholder, .field textarea::placeholder, .capture-row input::placeholder { color: var(--muted); opacity: 0.7; }
    .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
    .grid-2 .field { margin-top: 8px; }
    .form-actions { margin-top: 12px; }
    .form-actions .primary { width: 100%; padding: 8px 12px; }
    .form-note { margin-top: 8px; font-size: 11.5px; color: var(--muted); min-height: 16px; overflow-wrap: anywhere; }
    .form-note.ok { color: var(--ok); }
    .form-note.err { color: var(--danger); }

    /* ── Empty state ────────────────────────────────────── */
    .empty { padding: 26px 0 8px; text-align: center; color: var(--muted); }
    .empty .glyph {
      width: 40px; height: 40px; margin: 0 auto 10px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--line-strong); border-radius: 12px; color: var(--muted);
    }
    .empty .glyph svg { width: 17px; height: 17px; }
    .empty .hint {
      display: inline-block; margin-top: 8px; padding: 3px 9px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px; color: var(--ink);
      background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">MODELSWAP</div>
    <div class="conn" id="conn"><span class="dot"></span><span id="conn-text">连接中</span></div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main>
    <section id="requests-section" hidden>
      <div class="section-label"><span>待捕获</span><span class="count" id="pending-count"></span></div>
      <div id="list"></div>
    </section>
    <section id="empty" class="empty" hidden>
      <div class="glyph">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="14" r="4.5"/><path d="M11.5 10.5 20 2m-4 2 3 3m-6 0 2.5 2.5"/></svg>
      </div>
      <div>没有待捕获的凭证请求</div>
      <div class="hint">modelswap vault request &lt;KEY&gt; --wait</div>
    </section>
    <section id="save-section">
      <div class="section-label"><span>手动保存</span></div>
      <form id="save-form" novalidate></form>
    </section>
  </main>
  <script type="module" src="dist/popup.js"></script>
</body>
</html>
